<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GENT Iconic Web</title>
<link rel="icon" type="image/png" href="/znte-favicon.png">
<link rel="stylesheet" href="/style.css">   <!-- znte.co.uk site styles: navbar, fonts -->
<style>
  :root {
    --bg: #1a1a1a; --panel: #1b1d20; --edge: #2c2f33; --text: #e6e8ea; --muted: #9aa3ad;
    --accent: #0aa1d8; --warn: #ffb300; --fire: #e2483a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 "Segoe UI", Tahoma, Verdana, sans-serif; }
  .navbar .logo img { display: block; }
  .wrap { display: flex; gap: 16px; padding: 16px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
  .stage { position: relative; flex: 1 1 640px; max-width: 987px; }
  canvas#panel { width: 100%; height: auto; display: block; touch-action: none; border-radius: 6px;
    background: #0f0f0f; -webkit-tap-highlight-color: transparent; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: rgba(8, 10, 12, 0.86); border-radius: 6px; text-align: center;
    padding: 16px; }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0; font-size: 22px; font-weight: bold; letter-spacing: 0.5px; }
  .overlay p { margin: 0; color: var(--muted); max-width: 440px; }
  button { font: inherit; color: var(--text); background: #2a2e33; border: 1px solid #3a3f45; border-radius: 4px;
    padding: 6px 10px; cursor: pointer; }
  button:hover { background: #343941; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: bold;
    padding: 10px 22px; font-size: 16px; }
  .side { flex: 0 1 360px; min-width: 280px; background: var(--panel); border: 1px solid var(--edge);
    border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 10px; max-height: 90vh; }
  .side h2 { margin: 0; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  .side h3 { margin: 6px 0 0; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
  .devs { overflow: auto; max-height: 220px; border: 1px solid var(--edge); border-radius: 4px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { padding: 3px 6px; text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; background: #24272b; color: var(--muted); font-weight: normal; }
  tr { cursor: pointer; }
  tr.sel td { background: #0d3c57; }
  tr.fire td { color: #ff9a8f; }
  tr.fault td { color: #ffd27a; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .row button { padding: 5px 8px; font-size: 12px; }
  input, select { font: inherit; font-size: 12px; background: #111316; color: var(--text); border: 1px solid #3a3f45;
    border-radius: 4px; padding: 4px 6px; }
  input[type=number] { width: 64px; }
  .log { font: 11px/1.35 Consolas, "Courier New", monospace; background: #fbfaf0; color: #222; border-radius: 4px;
    padding: 6px; height: 150px; overflow: auto; white-space: pre; }
  .log .FIRE { color: #c8102e; } .log .FAULT { color: #9a6a00; }
  .status { min-height: 1.4em; color: #9fd3ff; font-size: 12px; }
  .toggle { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  @media (max-width: 760px) { .wrap { padding: 8px; } .side { max-height: none; } }
</style>
</head>
<body>
<nav class="navbar">
  <div class="logo">
    <a href="/"><img src="/znte.png" alt="znte logo"></a>
  </div>
</nav>
<div class="wrap">
  <div class="stage">
    <canvas id="panel" width="987" height="843" aria-label="GENT Iconic control panel"></canvas>
    <div class="overlay" id="start">
      <h1>GENT Iconic Simulator</h1>
      <p>A simulation of the unreleased GENT Iconic.</p>
      <button class="primary" id="go">Start panel</button>
      <p id="startmsg"></p>
    </div>
  </div>

  <aside class="side">
    <h2>Site controls <label class="toggle"><input type="checkbox" id="sound" checked> Buzzer sound</label></h2>
    <div class="row"><span style="color:var(--muted);font-size:12px">Loop</span>
      <select id="devloop"></select><span id="loopinfo" style="color:var(--muted);font-size:12px"></span></div>
    <div class="devs"><table id="devtable"><thead><tr><th>No.</th><th>Type</th><th>Zn</th><th>Label</th>
      <th>Analogue</th><th>State</th></tr></thead><tbody></tbody></table></div>
    <div class="row"><span style="color:var(--muted);font-size:12px">Amount / &deg;C</span>
      <input type="number" id="amount" placeholder="default"></div>
    <h3>Selected device</h3>
    <div class="row">
      <button data-c="mcp {d} on">Break glass</button><button data-c="mcp {d} off">Replace glass</button>
      <button data-c="smoke {d} {a}">Smoke</button><button data-c="canned {d} {a}">Canned smoke</button>
      <button data-c="steam {d} {a}">Steam</button><button data-c="heat {d} {a}">Heat gun</button>
      <button data-c="co {d} {a}">CO</button><button data-c="dirty {d} {a}">Dirty</button>
      <button data-c="clean {d}">Clean / clear</button>
      <button data-c="remove {d}">Remove head</button><button data-c="fit {d}">Fit head</button>
      <button data-c="input {d} on">Input on</button><button data-c="input {d} off">Input off</button>
      <button data-c="input {d} oc">Input OC</button>
    </div>
    <div class="row"><select id="fkind"></select>
      <button data-c="fail {d} {k}">Fail</button><button data-c="repair {d} {k}">Repair</button></div>
    <h3>Loop cable &amp; power</h3>
    <div class="row"><span style="font-size:12px;color:var(--muted)">Cable after No.</span>
      <input type="number" id="cable" value="1" min="0">
      <button data-c="wiring {w} oc">Open</button><button data-c="wiring {w} sc">Short</button>
      <button data-c="wiring {w} ok">Repair</button></div>
    <div class="row"><button data-c="power mains fail">Mains fail</button><button data-c="power mains ok">Mains restore</button>
      <button data-c="power batt fault">Battery fault</button><button data-c="power batt ok">Battery OK</button></div>
    <div class="status" id="status"></div>
    <h3>Printer</h3>
    <div class="log" id="log"></div>
  </aside>
</div>

<script>
"use strict";
// Where the simulator server is.  Leave "" when this page is served by the server itself;
// on GitHub Pages put the server address here, e.g. "wss://gent-iconic.onrender.com/ws".
const SERVER = "wss://gent-iconic.onrender.com/ws";

const cv = document.getElementById("panel");
const ctx = cv.getContext("2d");
const FONT = 'Tahoma, "Segoe UI", Verdana, Arial, sans-serif';
let items = {}, order = [], images = {}, W = 987, H = 843, ws = null, dirty = false, selected = null;

// ---------------------------------------------------------------- canvas size (sharp on hi-dpi)
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const cssW = cv.clientWidth || W;
  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(cssW * H / W * dpr);
  dirty = true;
}
window.addEventListener("resize", fit);

// ---------------------------------------------------------------- drawing (mirrors Tk canvas items)
function pathPoints(c, smooth, closed) {
  const n = c.length / 2, P = i => [c[2 * ((i % n + n) % n)], c[2 * ((i % n + n) % n) + 1]];
  ctx.beginPath();
  if (!smooth || n < 3) {
    ctx.moveTo(c[0], c[1]);
    for (let i = 1; i < n; i++) ctx.lineTo(c[2 * i], c[2 * i + 1]);
    if (closed) ctx.closePath();
    return;
  }
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  if (closed) {                       // Tk: quadratic splines between edge midpoints, vertices as controls
    let m = mid(P(n - 1), P(0));
    ctx.moveTo(m[0], m[1]);
    for (let i = 0; i < n; i++) {
      const ctl = P(i), e = mid(P(i), P(i + 1));
      ctx.quadraticCurveTo(ctl[0], ctl[1], e[0], e[1]);
    }
    ctx.closePath();
  } else {
    ctx.moveTo(c[0], c[1]);
    for (let i = 1; i < n - 1; i++) {
      const e = i < n - 2 ? mid(P(i), P(i + 1)) : P(n - 1);
      ctx.quadraticCurveTo(P(i)[0], P(i)[1], e[0], e[1]);
    }
  }
}

function stroke(col, w, dash) {
  if (!col) return;
  ctx.strokeStyle = col; ctx.lineWidth = w || 1;
  ctx.setLineDash(dash || []);
  ctx.stroke();
  ctx.setLineDash([]);
}

function fontOf(f) { f = f || [13, false]; return (f[1] ? "bold " : "") + f[0] + "px " + FONT; }

function wrapLines(text, maxW) {
  const out = [];
  for (const para of String(text).split("\n")) {
    if (!maxW) { out.push(para); continue; }
    let line = "";
    for (const word of para.split(" ")) {
      const t = line ? line + " " + word : word;
      if (ctx.measureText(t).width > maxW && line) { out.push(line); line = word; } else line = t;
    }
    out.push(line);
  }
  return out;
}

function drawText(it) {
  const f = it.font || [13, false];
  ctx.font = fontOf(f);
  ctx.fillStyle = it.fill === undefined ? "black" : it.fill;
  const lines = wrapLines(it.text === undefined ? "" : it.text, it.width || 0);
  const lh = f[0] * 1.2;
  const widths = lines.map(l => ctx.measureText(l).width);
  const bw = Math.max(0, ...widths), bh = lh * lines.length;
  const a = it.anchor || "center";
  let x0 = it.c[0], y0 = it.c[1];
  x0 -= (a === "center" || a === "n" || a === "s") ? bw / 2 : (a.includes("e") ? bw : 0);
  y0 -= (a === "center" || a === "e" || a === "w") ? bh / 2 : (a.includes("s") ? bh : 0);
  ctx.textBaseline = "top";
  const j = it.justify || "left";
  lines.forEach((l, i) => {
    const dx = j === "center" ? (bw - widths[i]) / 2 : j === "right" ? bw - widths[i] : 0;
    ctx.fillText(l, x0 + dx, y0 + i * lh + f[0] * 0.08);
  });
}

function drawItem(it) {
  const c = it.c;
  switch (it.k) {
    case "rect": {
      const x0 = Math.min(c[0], c[2]), y0 = Math.min(c[1], c[3]), w = Math.abs(c[2] - c[0]), h = Math.abs(c[3] - c[1]);
      if (it.fill) { ctx.fillStyle = it.fill; ctx.fillRect(x0, y0, w, h); }
      const ol = it.outline === undefined ? "black" : it.outline;
      if (ol) { ctx.beginPath(); ctx.rect(x0 + 0.5, y0 + 0.5, w - 1, h - 1); stroke(ol, it.width || 1); }
      break;
    }
    case "oval": {
      ctx.beginPath();
      ctx.ellipse((c[0] + c[2]) / 2, (c[1] + c[3]) / 2, Math.abs(c[2] - c[0]) / 2, Math.abs(c[3] - c[1]) / 2, 0, 0, 2 * Math.PI);
      if (it.fill) { ctx.fillStyle = it.fill; ctx.fill(); }
      const ol = it.outline === undefined ? "black" : it.outline;
      if (ol) stroke(ol, it.width || 1);
      break;
    }
    case "arc": {
      const cx = (c[0] + c[2]) / 2, cy = (c[1] + c[3]) / 2, rx = Math.abs(c[2] - c[0]) / 2, ry = Math.abs(c[3] - c[1]) / 2;
      const s = -(it.start || 0) * Math.PI / 180, e = -((it.start || 0) + (it.extent === undefined ? 90 : it.extent)) * Math.PI / 180;
      const style = it.style || "pieslice";
      ctx.beginPath();
      if (style === "pieslice") ctx.moveTo(cx, cy);
      ctx.ellipse(cx, cy, rx, ry, 0, s, e, (it.extent === undefined ? 90 : it.extent) > 0);
      if (style !== "arc") ctx.closePath();
      if (it.fill && style !== "arc") { ctx.fillStyle = it.fill; ctx.fill(); }
      const ol = it.outline === undefined ? "black" : it.outline;
      if (ol) stroke(ol, it.width || 1);
      break;
    }
    case "poly": {
      pathPoints(c, it.smooth, true);
      const fill = it.fill === undefined ? "black" : it.fill;
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (it.outline) stroke(it.outline, it.width || 1);
      break;
    }
    case "line": {
      pathPoints(c, it.smooth, false);
      ctx.lineCap = it.capstyle === "round" ? "round" : it.capstyle === "projecting" ? "square" : "butt";
      ctx.lineJoin = it.joinstyle || "round";
      stroke(it.fill === undefined ? "black" : it.fill, it.width || 1, it.dash);
      ctx.lineCap = "butt"; ctx.lineJoin = "miter";
      break;
    }
    case "text": drawText(it); break;
    case "img": {
      const im = images[it.i];
      if (!im || !im.ok) break;
      const w = im.w * (it.s || 1), h = im.h * (it.s || 1), a = it.anchor || "center";
      let x = c[0], y = c[1];
      x -= (a === "center" || a === "n" || a === "s") ? w / 2 : (a.includes("e") ? w : 0);
      y -= (a === "center" || a === "e" || a === "w") ? h / 2 : (a.includes("s") ? h : 0);
      ctx.drawImage(im.el, x, y, w, h);
      break;
    }
  }
}

function render() {
  if (dirty) {
    dirty = false;
    const k = cv.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    ctx.fillStyle = "#0f0f0f"; ctx.fillRect(0, 0, W, H);
    for (const key of order) { const it = items[key]; if (it) drawItem(it); }
  }
  requestAnimationFrame(render);
}

// ---------------------------------------------------------------- sound (piezo-style)
let audio = null, buzzOsc = null, wantBuzz = false;
function audioOn() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } }
  if (audio && audio.state === "suspended") audio.resume();
}
function tone(seconds) {
  if (!audio || !document.getElementById("sound").checked) return null;
  const o = audio.createOscillator(), g = audio.createGain(), lp = audio.createBiquadFilter();
  o.type = "square"; o.frequency.value = 2940;
  lp.type = "lowpass"; lp.frequency.value = 6000;
  g.gain.value = 0.0001;
  o.connect(lp); lp.connect(g); g.connect(audio.destination);
  const t = audio.currentTime;
  g.gain.exponentialRampToValueAtTime(0.06, t + 0.004);
  if (seconds) g.gain.setValueAtTime(0.06, t + seconds - 0.004), g.gain.exponentialRampToValueAtTime(0.0001, t + seconds);
  o.start(t);
  if (seconds) o.stop(t + seconds + 0.01);
  return { o, g };
}
function setBuzz(on) {
  wantBuzz = on;
  if (on && !buzzOsc) buzzOsc = tone(0);
  if (!on && buzzOsc) { try { buzzOsc.o.stop(); } catch (e) {} buzzOsc = null; }
}

// ---------------------------------------------------------------- messages
function onMessage(m) {
  switch (m.t) {
    case "init": W = m.w; H = m.h; fit();
      document.getElementById("fkind").innerHTML = m.faults.map(f => `<option>${f}</option>`).join("");
      break;
    case "frame":
      if (m.imgs) for (const [id, d] of Object.entries(m.imgs)) {
        const el = new Image(), rec = { el, w: d.w, h: d.h, ok: false };
        el.onload = () => { rec.ok = true; dirty = true; };
        el.src = d.d; images[id] = rec;
      }
      if (m.add) Object.assign(items, m.add);
      order = m.order;
      const live = new Set(order);
      for (const k of Object.keys(items)) if (!live.has(k)) delete items[k];
      dirty = true;
      break;
    case "snd": setBuzz(m.buzz); break;
    case "blip": tone(0.04); break;
    case "log": addLog(m.l, m.k); break;
    case "status": document.getElementById("status").textContent = m.s; break;
    case "devs": showDevs(m); break;
    case "bye": showStart(m.why === "full" ? "The simulator is busy right now - please try again in a few minutes."
                                           : "Session ended after a period of inactivity."); break;
  }
}

function addLog(text, kind) {
  const log = document.getElementById("log"), line = document.createElement("div");
  line.textContent = text; line.className = kind || "";
  log.appendChild(line);
  while (log.childNodes.length > 400) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}

function showDevs(m) {
  const sel = document.getElementById("devloop");
  const label = l => `Loop ${l[0]} (${l[1]})` + (l[2] ? ` - ${l[2]} FIRE` : "") + (l[3] ? ` - ${l[3]} fault` : "");
  if (sel.options.length !== m.loops.length) sel.innerHTML = m.loops.map(l => `<option value="${l[0]}"></option>`).join("");
  m.loops.forEach((l, i) => { sel.options[i].textContent = label(l); });
  sel.value = String(m.loop);
  const rows = m.d;
  const tb = document.querySelector("#devtable tbody");
  tb.innerHTML = "";
  for (const r of rows) {
    const tr = document.createElement("tr");
    tr.dataset.id = r[0];
    if (r[0] === selected) tr.classList.add("sel");
    if (r[6].includes("FIRE")) tr.classList.add("fire"); else if (r[6].includes("FAULT")) tr.classList.add("fault");
    for (const v of [`L${r[0].replace(".", "/")}`, r[2], r[3], r[4], r[5], r[6]]) {
      const td = document.createElement("td"); td.textContent = v; tr.appendChild(td);
    }
    tr.onclick = () => { selected = r[0]; document.querySelectorAll("#devtable tr.sel").forEach(t => t.classList.remove("sel"));
                         tr.classList.add("sel"); };
    tb.appendChild(tr);
  }
}

function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

document.querySelectorAll("button[data-c]").forEach(b => b.onclick = () => {
  const c = b.dataset.c;
  if (c.includes("{d}") && !selected) { document.getElementById("status").textContent = "Select a device first"; return; }
  const cmd = c.replace("{d}", selected || "").replace("{a}", document.getElementById("amount").value || "")
               .replace("{k}", document.getElementById("fkind").value).replace("{w}", document.getElementById("cable").value || "0");
  send({ t: "site", c: cmd.trim().replace(/\s+/g, " ") });
});
document.getElementById("devloop").onchange = e => send({ t: "devloop", loop: Number(e.target.value) });
document.getElementById("sound").onchange = e => { send({ t: "sound", on: e.target.checked }); if (!e.target.checked) setBuzz(false); else if (wantBuzz) setBuzz(true); };

// ---------------------------------------------------------------- pointer & keys-
function toPanel(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
cv.addEventListener("pointerdown", e => { audioOn(); const p = toPanel(e); send({ t: "down", x: p.x, y: p.y }); e.preventDefault(); });
cv.addEventListener("pointerup", e => { const p = toPanel(e); send({ t: "up", x: p.x, y: p.y }); });
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const map = { Backspace: "BackSpace", Enter: "Return", Escape: "Escape" };
  if (e.key.length === 1 || map[e.key]) {
    send({ t: "key", char: e.key.length === 1 ? e.key : "", keysym: map[e.key] || e.key });
    if (e.key === "Backspace") e.preventDefault();
  }
});

// ---------------------------------------------------------------- connect
function showStart(msg) {
  document.getElementById("start").hidden = false;
  document.getElementById("go").textContent = "Start panel";
  document.getElementById("startmsg").textContent = msg || "";
  setBuzz(false);
}
function connect() {
  audioOn();
  const url = SERVER || ((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  document.getElementById("startmsg").textContent = "Connecting... (a sleeping server can take up to a minute to wake)";
  document.getElementById("go").textContent = "Connecting...";
  items = {}; order = []; dirty = true;
  ws = new WebSocket(url);
  ws.onopen = () => { document.getElementById("start").hidden = true; send({ t: "sound", on: document.getElementById("sound").checked }); };
  ws.onmessage = ev => { try { onMessage(JSON.parse(ev.data)); } catch (e) { console.error(e); } };
  ws.onclose = () => { if (document.getElementById("start").hidden) showStart("Connection closed."); else showStart(document.getElementById("startmsg").textContent.startsWith("Connecting") ? "Could not reach the simulator server." : document.getElementById("startmsg").textContent); };
}
document.getElementById("go").onclick = connect;
fit(); render();
</script>
</body>
</html>
